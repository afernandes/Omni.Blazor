name: Usage question
description: Ask for help using Omni.Blazor after checking the documentation.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please check the README, live showcase, generated component manifest, and existing issues before asking a question.

        Use the bug report form for reproducible defects and the security policy for vulnerabilities.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Component usage
        - Forms and validation
        - Data components
        - Styling and theming
        - Accessibility
        - Localization packages
        - JavaScript interop
        - MCP tool or generated manifest
        - Installation or packaging
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: AndersonN.Omni.Blazor x.y.z
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to accomplish and where you are blocked.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a minimal code sample and the documentation or examples you already checked.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: I searched the documentation, showcase, and existing issues first.
          required: true
        - label: This is not a security vulnerability.
          required: true
