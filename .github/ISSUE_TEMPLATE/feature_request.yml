name: Feature request
description: Propose an improvement to Omni.Blazor or its tooling.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. Describe the user problem first so the design can be evaluated independently from a specific implementation.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New component
        - Existing component API or behavior
        - Styling, theming, or design tokens
        - Accessibility
        - Localization packages
        - JavaScript interop
        - MCP tool or generated manifest
        - Documentation or showcase
        - Packaging, build, or CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user need, limitation, or workflow should this proposal address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and, when relevant, a possible component API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or other approaches you considered.

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Could the proposal change an existing public API or rendered behavior?
      options:
        - No known compatibility impact
        - Additive public API
        - Behavioral change
        - Breaking public API change
        - Unsure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, links, prior art, or implementation notes that help evaluate the proposal.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the component manifest for an existing solution.
          required: true
        - label: I described the user problem separately from the proposed implementation.
          required: true
