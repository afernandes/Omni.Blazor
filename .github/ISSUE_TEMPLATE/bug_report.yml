name: Bug report
description: Report a reproducible problem in Omni.Blazor or its tooling.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Omni.Blazor. Please search existing issues before submitting a new report.

        Do not disclose security vulnerabilities here. Follow the repository's security policy instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Components and rendering
        - Forms and validation
        - Data components
        - Styling and theming
        - Accessibility
        - Localization packages
        - JavaScript interop
        - MCP tool or generated manifest
        - Packaging, build, or CI
        - Demo or showcase
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package and version
      description: Include the affected NuGet package or tool and its exact version.
      placeholder: AndersonN.Omni.Blazor x.y.z
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Hosting model
      options:
        - Blazor Server or Interactive Server
        - Blazor WebAssembly or Interactive WebAssembly
        - Blazor Web App with Interactive Auto
        - .NET MAUI Blazor Hybrid
        - Not applicable
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the .NET SDK/runtime, operating system, browser, and other relevant dependencies.
      placeholder: |
        .NET SDK:
        Operating system:
        Browser and version:
        Other relevant packages:
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and why it appears to be a defect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample, repository, or ordered steps that reproduce the problem.
      placeholder: |
        1. Configure ...
        2. Render ...
        3. Interact with ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors, logs, screenshots, or recordings after removing secrets and personal data.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I verified the problem against the latest stable release when practical.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
