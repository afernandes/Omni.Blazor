name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'scripts/prepare_github_pages.py'
      - 'scripts/serve_github_pages.py'
      - 'scripts/tests/test_prepare_github_pages.py'
      - 'src/Forneria.Demo/**'
      - 'src/Omni.Blazor/**'
      - 'test/Omni.Blazor.BrowserTests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true
  PROJECT: src/Forneria.Demo/Forneria.Demo.Wasm/Forneria.Demo.Wasm.csproj
  BROWSER_TESTS: test/Omni.Blazor.BrowserTests/Omni.Blazor.BrowserTests.csproj
  PUBLISH_ROOT: artifacts/github-pages
  PUBLISH_DIR: artifacts/github-pages/wwwroot

jobs:
  build:
    name: Build and verify WebAssembly site
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.pages.outputs.base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore
        run: dotnet restore Omni.Blazor.slnx

      - name: Publish standalone WebAssembly host
        run: >-
          dotnet publish "$PROJECT"
          --configuration Release
          --no-restore
          --output "$PUBLISH_ROOT"
          -p:ContinuousIntegrationBuild=true

      - name: Prepare project-site artifact
        run: >-
          python scripts/prepare_github_pages.py "$PUBLISH_DIR" "${{ steps.pages.outputs.base_path }}"
          --routes-from src/Forneria.Demo/Forneria.Demo.Pages
          --routes-from src/Forneria.Demo/Forneria.Demo.Wasm

      - name: Verify artifact preparation
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build browser smoke tests
        run: dotnet build "$BROWSER_TESTS" --configuration Release --no-restore

      - name: Install Chromium
        run: pwsh test/Omni.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test GitHub Pages base path
        env:
          OMNI_BROWSER_HOST: wasm
          OMNI_BROWSER_CONFIGURATION: Release
          OMNI_BROWSER_PATH_BASE: ${{ steps.pages.outputs.base_path }}
          OMNI_BROWSER_STATIC_ROOT: ${{ env.PUBLISH_DIR }}
        run: >-
          dotnet test "$BROWSER_TESTS"
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~GitHubPagesBrowserTests|FullyQualifiedName~PublishedRouteSweepBrowserTests"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
