name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    branches: [main]
    # Sem paths-ignore aqui: com "required status checks" no ruleset da main, um PR
    # que não dispara o CI ficaria travado esperando um check que nunca roda. Assim
    # todo PR roda o Build e os checks obrigatórios sempre reportam.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so MinVer can resolve version from git tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Omni.Blazor.slnx

      - name: NuGet vulnerability gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet list Omni.Blazor.slnx package --vulnerable --include-transitive \
            --format json --output-version 1 > vulnerable-packages.json
          python3 scripts/check_vulnerable_packages.py vulnerable-packages.json

      - name: Build
        run: dotnet build Omni.Blazor.slnx --configuration Release --no-restore

      - name: Test (+ coverage)
        shell: bash
        run: |
          for proj in \
            test/Omni.Blazor.Tests/Omni.Blazor.Tests.csproj \
            test/Omni.Blazor.ManifestGen.Tests/Omni.Blazor.ManifestGen.Tests.csproj \
            test/Omni.Blazor.Mcp.Tests/Omni.Blazor.Mcp.Tests.csproj; do
            dotnet test "$proj" --configuration Release --no-build \
              --settings coverlet.runsettings \
              --collect:"XPlat Code Coverage" \
              --results-directory "${{ github.workspace }}/coverage"
          done

      - name: Coverage gate (>= 80% line)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_coverage.py 80 coverage Omni.Blazor Omni.Blazor.Ai Omni.Blazor.ManifestGen Omni.Blazor.Mcp

      - name: Templates have no copy-paste drift
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_template_code.py

      - name: Async safety gate
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_async_safety.py

      - name: Manifest is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet run --project tools/Omni.Blazor.ManifestGen --configuration Release --no-build
          git diff --exit-code -- docs/components.json llms.txt llms-full.txt \
            || { echo "::error::Manifest artifacts are stale — run 'dotnet run --project tools/Omni.Blazor.ManifestGen' and commit docs/components.json + llms.txt + llms-full.txt"; exit 1; }

      - name: Pack (Omni.Blazor, dry-run)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Omni.Blazor/Omni.Blazor.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:ContinuousIntegrationBuild=true

      - name: Pack (Omni.Blazor.Ai, dry-run)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Omni.Blazor.Ai/Omni.Blazor.Ai.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:ContinuousIntegrationBuild=true

      - name: Pack (MCP tool, dry-run)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack tools/Omni.Blazor.Mcp/Omni.Blazor.Mcp.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:ContinuousIntegrationBuild=true

      - name: Smoke test packed Server, WASM, AI and MCP consumers
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/smoke_packages.py ./artifacts

      - name: Upload preview packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-preview
          path: ./artifacts/*.*nupkg
          retention-days: 14
          if-no-files-found: error

  native-aot:
    name: Native AOT + trimming
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Native AOT smoke consumer
        run: dotnet restore test/Omni.Blazor.AotSmoke/Omni.Blazor.AotSmoke.csproj --runtime linux-x64

      - name: Publish Native AOT smoke consumer
        run: |
          dotnet publish test/Omni.Blazor.AotSmoke/Omni.Blazor.AotSmoke.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-restore \
            --output ./artifacts/aot

      - name: Run Native AOT smoke consumer
        run: ./artifacts/aot/Omni.Blazor.AotSmoke

  browser:
    name: Browser tests (${{ matrix.host }}, Chromium)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: server
            project: src/Forneria.Demo/Forneria.Demo/Forneria.Demo.csproj
          - host: wasm
            project: src/Forneria.Demo/Forneria.Demo.Wasm/Forneria.Demo.Wasm.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Omni.Blazor.slnx

      - name: Build browser tests and showcase
        run: |
          dotnet build ${{ matrix.project }} --configuration Release --no-restore
          dotnet build test/Omni.Blazor.BrowserTests/Omni.Blazor.BrowserTests.csproj --configuration Release --no-restore

      - name: Install Chromium
        run: pwsh test/Omni.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run browser tests
        env:
          OMNI_BROWSER_HOST: ${{ matrix.host }}
          OMNI_BROWSER_CONFIGURATION: Release
        # The route sweep belongs to the Pages workflow, which runs it against the trimmed,
        # prepared artifact — the only build where it can find what it exists to find. Here
        # it would only duplicate coverage, add minutes to both matrix legs, and starve the
        # neighbouring tests of time (it already tipped a 15s scheduler wait over the edge).
        run: >-
          dotnet test test/Omni.Blazor.BrowserTests/Omni.Blazor.BrowserTests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName!~PublishedRouteSweepBrowserTests"
