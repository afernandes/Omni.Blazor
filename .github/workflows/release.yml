name: Release

# Triggered when a version tag is pushed (e.g. `git tag v1.2.3 && git push --tags`).
# MinVer derives the package version from the tag automatically — no version
# edits in the .csproj. Pre-release tags (`v1.2.3-beta.1`) ship as pre-release
# packages to NuGet.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not push to NuGet'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # create GitHub Release
  packages: write   # publish to GitHub Packages

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true
  PROJECT: src/Omni.Blazor/Omni.Blazor.csproj
  ARTIFACTS: ./artifacts

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.minver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Omni.Blazor.slnx

      - name: Resolve version (MinVer)
        id: minver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(dotnet msbuild ${{ env.PROJECT }} -t:MinVer -getProperty:PackageVersion | tail -n1)
          fi
          test -n "$VERSION" || { echo "::error::Could not resolve package version"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Validating Omni.Blazor v$VERSION"

      - name: NuGet vulnerability gate
        run: |
          dotnet list Omni.Blazor.slnx package --vulnerable --include-transitive \
            --format json --output-version 1 > vulnerable-packages.json
          python3 scripts/check_vulnerable_packages.py vulnerable-packages.json

      - name: Build (Release)
        run: dotnet build Omni.Blazor.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test release binaries
        run: |
          for proj in \
            test/Omni.Blazor.Tests/Omni.Blazor.Tests.csproj \
            test/Omni.Blazor.ManifestGen.Tests/Omni.Blazor.ManifestGen.Tests.csproj \
            test/Omni.Blazor.Mcp.Tests/Omni.Blazor.Mcp.Tests.csproj; do
            dotnet test "$proj" --configuration Release --no-build
          done

      - name: Install Chromium
        run: pwsh test/Omni.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test DataForm in Chromium
        run: dotnet test test/Omni.Blazor.BrowserTests/Omni.Blazor.BrowserTests.csproj --configuration Release --no-build

      - name: Source quality gates
        run: |
          python3 scripts/check_template_code.py
          python3 scripts/check_async_safety.py
          python3 scripts/check_localization_literals.py

      - name: Localization catalogs are up to date
        shell: pwsh
        run: |
          ./tools/generate-localization-resources.ps1
          git diff --exit-code -- src/Omni.Blazor/Localization/Resources src/Omni.Blazor/Localization/OmniTranslationKeys.cs || throw "Localization artifacts are stale."

      - name: Manifest is up to date
        run: |
          dotnet run --project tools/Omni.Blazor.ManifestGen --configuration Release --no-build
          git diff --exit-code -- docs/components.json llms.txt llms-full.txt \
            || { echo "::error::Manifest artifacts are stale"; exit 1; }

      - name: Pack
        run: |
          dotnet pack ${{ env.PROJECT }} \
            --configuration Release \
            --no-build \
            --output ${{ env.ARTIFACTS }} \
            -p:ContinuousIntegrationBuild=true

      - name: Verify package contents (static web assets present)
        run: |
          set -e
          NUPKG=$(ls ${{ env.ARTIFACTS }}/AndersonN.Omni.Blazor.*.nupkg | grep -v symbols | head -n1)
          echo "Inspecting $NUPKG"
          # Guarda: a versão empacotada (MinVer) DEVE bater com a tag. Se o MinVer
          # ignorar a tag (ex.: MinVerTagPrefix não aplicado) ele gera 0.0.0-alpha.0.x
          # e o push silenciaria via --skip-duplicate. Falhar aqui, ruidosamente.
          EXPECTED="${{ env.ARTIFACTS }}/AndersonN.Omni.Blazor.${{ steps.minver.outputs.version }}.nupkg"
          test -f "$EXPECTED" || { echo "::error::Versão empacotada != tag — esperado $EXPECTED, gerado $NUPKG (MinVer provavelmente ignorou a tag)"; exit 1; }
          unzip -l "$NUPKG" | tee /tmp/contents.txt
          grep -q "staticwebassets/css/omni.css" /tmp/contents.txt || (echo "::error::omni.css not packed" && exit 1)
          grep -q "staticwebassets/js/" /tmp/contents.txt || (echo "::error::no JS assets packed" && exit 1)

      - name: Pack MCP tool (AndersonN.Omni.Blazor.Mcp)
        run: |
          set -e
          dotnet pack tools/Omni.Blazor.Mcp/Omni.Blazor.Mcp.csproj \
            --configuration Release \
            --no-build \
            --output ${{ env.ARTIFACTS }} \
            -p:ContinuousIntegrationBuild=true
          # Same version guard as the library: the packed tool MUST match the tag,
          # else `dotnet nuget push --skip-duplicate` could silently no-op a
          # mismatched (or absent) tool package.
          EXPECTED="${{ env.ARTIFACTS }}/AndersonN.Omni.Blazor.Mcp.${{ steps.minver.outputs.version }}.nupkg"
          test -f "$EXPECTED" || { echo "::error::MCP tool version != tag — esperado $EXPECTED"; exit 1; }

      - name: Pack AI package (AndersonN.Omni.Blazor.Ai)
        run: |
          set -e
          dotnet pack src/Omni.Blazor.Ai/Omni.Blazor.Ai.csproj \
            --configuration Release \
            --no-build \
            --output ${{ env.ARTIFACTS }} \
            -p:ContinuousIntegrationBuild=true
          # Same version guard: the packed AI package MUST match the tag, else
          # `dotnet nuget push --skip-duplicate` could silently no-op a mismatch.
          EXPECTED="${{ env.ARTIFACTS }}/AndersonN.Omni.Blazor.Ai.${{ steps.minver.outputs.version }}.nupkg"
          test -f "$EXPECTED" || { echo "::error::AI package version != tag — esperado $EXPECTED"; exit 1; }

      - name: Pack PO/Gettext adapter (AndersonN.Omni.Blazor.Localization.Po)
        run: |
          set -e
          dotnet pack src/Omni.Blazor.Localization.Po/Omni.Blazor.Localization.Po.csproj \
            --configuration Release \
            --no-build \
            --output ${{ env.ARTIFACTS }} \
            -p:ContinuousIntegrationBuild=true
          EXPECTED="${{ env.ARTIFACTS }}/AndersonN.Omni.Blazor.Localization.Po.${{ steps.minver.outputs.version }}.nupkg"
          test -f "$EXPECTED" || { echo "::error::PO adapter version != tag — esperado $EXPECTED"; exit 1; }

      - name: Smoke test exact packed artifacts
        run: python3 scripts/smoke_packages.py ${{ env.ARTIFACTS }} ${{ steps.minver.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ steps.minver.outputs.version }}
          path: ${{ env.ARTIFACTS }}/*.*nupkg
          retention-days: 90
          if-no-files-found: error

  publish-nuget:
    name: Publish → NuGet.org
    needs: pack
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the GitHub OIDC token for NuGet trusted publishing
      contents: read    # checkout (global.json)
      actions: read     # download-artifact

    steps:
      - name: Checkout            # provides global.json for setup-dotnet (push jobs don't otherwise check out)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-${{ needs.pack.outputs.version }}
          path: ./artifacts

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: AndersonN   # nuget.org profile name (the package owner), NOT the e-mail

      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-github:
    name: Publish → GitHub Packages
    needs: pack
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout            # provides global.json for setup-dotnet (push jobs don't otherwise check out)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-${{ needs.pack.outputs.version }}
          path: ./artifacts

      - name: Push to GitHub Packages
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$GH_TOKEN" \
            --source "https://nuget.pkg.github.com/${GH_OWNER}/index.json" \
            --skip-duplicate

  github-release:
    name: GitHub Release
    needs: [pack, publish-nuget]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-${{ needs.pack.outputs.version }}
          path: ./artifacts

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Omni.Blazor ${{ needs.pack.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.pack.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
